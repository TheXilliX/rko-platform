<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBFAF7">
  <title>Вход — RKO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Urbanist:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --milk: #fbfaf7;
      --text-primary: #292929;
      --text-secondary: #5f5e5b;
      --text-soft: #81807f;
      --ink: var(--text-primary);
      --muted: var(--text-soft);
      --line: rgba(41, 41, 41, 0.34);
      --scarlet: #ff2400;
      --green: #2f7d57;
      --amber: #d79a2b;
      --success: var(--green);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      background: var(--milk);
      color: var(--ink);
      font-family: "Urbanist", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    .screen {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      background: var(--milk);
      pointer-events: none;
      animation: splash-away 1s cubic-bezier(.4,0,.2,1) 3.5s forwards;
    }

    .private-label {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      margin: 0;
      color: var(--muted);
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      opacity: 0;
      animation: label-sequence 3.5s cubic-bezier(.4,0,.2,1) 0.5s forwards;
    }

    .splash-word {
      position: absolute;
      top: 50%;
      left: 50%;
      margin: 0;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      font-size: clamp(3.25rem, 12vw, 9rem);
      font-weight: 650;
      letter-spacing: -0.075em;
      line-height: 0.9;
      opacity: 0;
      filter: blur(18px);
    }

    .splash-word.name { animation: vlad-sequence 1.8s cubic-bezier(.4,0,.2,1) 0.5s forwards; }
    .splash-word.rko {
      font-weight: 900;
      animation: rko-sequence 2s cubic-bezier(.4,0,.2,1) 2s forwards;
    }

    .auth-wrap {
      width: min(100%, 430px);
      opacity: 0;
      filter: blur(14px);
      animation: auth-arrival 1s cubic-bezier(.22,.75,.2,1) 3.5s forwards;
    }

    .auth-label {
      position: fixed;
      top: max(24px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      z-index: 10;
      display: block;
      visibility: visible;
      margin: 0;
      color: var(--text-soft);
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      opacity: 1;
      filter: blur(0);
      pointer-events: none;
      transition: opacity 0.6s ease, filter 0.6s ease;
    }

    .auth-label.is-hidden {
      opacity: 0;
      filter: blur(8px);
    }

    .auth-card {
      position: relative;
      isolation: isolate;
      min-height: 410px;
      overflow: visible;
      border-radius: 38px;
      background: transparent;
      transition: opacity 0.7s ease, filter 0.7s ease, transform 0.7s ease;
    }

    .auth-card.is-success {
      opacity: 0;
      filter: blur(22px);
      transform: scale(0.985);
    }

    .auth-form {
      display: grid;
      min-height: 410px;
      grid-template-rows: auto auto auto;
      align-content: center;
      gap: 22px;
      padding: 34px 46px 30px;
    }

    .login-title {
      align-self: start;
      justify-self: center;
      margin: 0;
      font-family: "Urbanist", "Helvetica Neue", sans-serif;
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      filter: blur(0);
      transition: opacity 0.75s cubic-bezier(.4,0,.2,1), filter 0.75s cubic-bezier(.4,0,.2,1);
    }

    .auth-form.is-ready .login-title { opacity: 0; filter: blur(5px); }

    .fields {
      display: grid;
      align-content: center;
      gap: 20px;
    }

    .field {
      position: relative;
      display: grid;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      caret-color: var(--ink);
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0.025em;
      text-align: center;
      transition: border-color 0.2s ease;
    }

    .field input::placeholder {
      color: var(--text-secondary);
      opacity: 1;
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      transition: opacity 0.18s ease;
    }

    .field input:not(:placeholder-shown)::placeholder { opacity: 0; }
    .field input:focus::placeholder { opacity: 0; }

    .field input:focus { border-color: var(--ink); }

    .password-input {
      padding: 0 42px;
      color: transparent !important;
      caret-color: var(--ink);
    }

    .password-display {
      position: absolute;
      right: 42px;
      bottom: 14px;
      left: 42px;
      overflow: hidden;
      color: var(--ink);
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0.025em;
      line-height: 1.2;
      text-align: center;
      text-overflow: clip;
      white-space: nowrap;
      pointer-events: none;
    }

    .eye-button {
      position: absolute;
      right: 7px;
      bottom: 11px;
      display: grid;
      width: 28px;
      height: 28px;
      padding: 0;
      place-items: center;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.86);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .eye-button.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .eye-button:active { transform: scale(0.88); }
    .eye-button svg { width: 19px; height: 19px; }
    .eye-button .eye-off { display: none; }
    .eye-button.is-revealed .eye-on { display: none; }
    .eye-button.is-revealed .eye-off { display: block; }

    .form-footer {
      display: grid;
      position: relative;
      grid-template-rows: 42px auto;
      align-content: start;
      justify-items: center;
      gap: 8px;
    }

    .submit-button {
      padding: 8px 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      grid-row: 1;
      grid-column: 1;
      font-family: "Urbanist", "Helvetica Neue", sans-serif;
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      opacity: 0;
      filter: blur(5px);
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.75s cubic-bezier(.4,0,.2,1), filter 0.75s cubic-bezier(.4,0,.2,1), transform 0.18s ease;
    }

    .auth-form.is-ready .submit-button {
      opacity: 1;
      filter: blur(0);
      pointer-events: auto;
      transform: scale(1);
    }

    .auth-form.is-ready .submit-button:active { transform: scale(0.94); }

    .auth-form.is-authenticated .submit-button {
      opacity: 0;
      filter: blur(5px);
      pointer-events: none;
      transition-duration: 0.3s, 0.3s, 0.18s;
    }

    .success-message {
      grid-row: 1;
      grid-column: 1;
      align-self: center;
      margin: 0;
      color: var(--success);
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 0.035em;
      opacity: 0;
      filter: blur(5px);
      pointer-events: none;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .success-message.is-visible {
      opacity: 1;
      filter: blur(0);
    }

    .password-help {
      grid-row: 2;
      grid-column: 1;
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    .password-help.is-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .password-help a {
      color: inherit;
      text-underline-offset: 3px;
    }

    body.error-flash { animation: error-flash 2.2s cubic-bezier(.4,0,.2,1); }

    @keyframes vlad-sequence {
      0% { opacity: 0; filter: blur(18px); transform: translate(-50%, -50%) scale(.985); }
      27.78%, 72.22% { opacity: 1; filter: blur(0); transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; filter: blur(9px); transform: translate(-50%, -50%) scale(1.01); }
    }

    @keyframes rko-sequence {
      0% { opacity: 0; filter: blur(18px); transform: translate(-50%, -50%) scale(.985); }
      25%, 75% { opacity: 1; filter: blur(0); transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; filter: blur(9px); transform: translate(-50%, -50%) scale(1.01); }
    }

    @keyframes label-sequence {
      0% { opacity: 0; filter: blur(8px); }
      14.29%, 85.71% { opacity: 1; filter: blur(0); }
      100% { opacity: 0; }
    }

    @keyframes splash-away { to { opacity: 0; visibility: hidden; } }

    @keyframes auth-arrival {
      from { opacity: 0; filter: blur(14px); }
      to { opacity: 1; filter: blur(0); }
    }

    @keyframes error-flash {
      0%, 100% { background-color: var(--milk); }
      10%, 12% { background-color: var(--scarlet); }
    }

    .menu-preview {
      position: absolute;
      top: 50%;
      left: 50%;
      margin: 0;
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      letter-spacing: -0.055em;
      opacity: 0;
      filter: blur(12px);
      transform: translate(-50%, -50%) scale(.985);
      transition: opacity 0.65s ease, filter 0.65s ease, transform 0.65s ease;
      pointer-events: none;
    }

    .menu-preview.is-visible {
      opacity: 1;
      filter: blur(0);
      transform: translate(-50%, -50%) scale(1);
    }

    @media (max-width: 560px) {
      .screen {
        place-items: start center;
        padding-top: max(76px, calc(env(safe-area-inset-top) + 46px));
      }
      .auth-wrap { width: min(100%, 370px); }
      .auth-card, .auth-form { min-height: 390px; }
      .auth-card { border-radius: 32px; }
      .auth-form {
        grid-template-rows: auto auto auto;
        gap: 18px;
        padding: 30px 28px 25px;
      }
      .splash-word { font-size: clamp(3.2rem, 18vw, 5.4rem); }
    }

    @media (max-height: 620px) {
      .screen { padding-top: max(34px, env(safe-area-inset-top)); }
      .auth-card, .auth-form { min-height: min(370px, calc(100svh - 54px)); }
      .auth-form { gap: 14px; padding-top: 22px; padding-bottom: 20px; }
      .fields { gap: 14px; }
    }
  </style>
</head>
<body>
  <div class="splash" aria-hidden="true">
    <p class="private-label">[ PRIVATE COURSE ]</p>
    <p class="splash-word name">Влад 2Hard</p>
    <p class="splash-word rko">RKO</p>
  </div>

  <p class="auth-label" id="authLabel">[ LOGIN ]</p>

  <main class="screen">
    <div class="auth-wrap">
      <section class="auth-card" id="authCard" aria-label="Авторизация">
        <form class="auth-form" id="authForm" novalidate>
          <h1 class="login-title">ВХОД</h1>

          <div class="fields">
            <div class="field">
              <label class="sr-only" for="login">Логин</label>
              <input id="login" name="login" type="text" placeholder="ЛОГИН" autocomplete="username" autocapitalize="none" spellcheck="false">
            </div>

            <div class="field">
              <label class="sr-only" for="password">Пароль</label>
              <input class="password-input" id="password" name="password" type="text" placeholder="ПАРОЛЬ" autocomplete="current-password" aria-describedby="passwordDisplay">
              <span class="password-display" id="passwordDisplay" aria-hidden="true"></span>
              <button class="eye-button" id="eyeButton" type="button" aria-label="Показать пароль" aria-pressed="false">
                <svg class="eye-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 3l18 18M10.6 6.15A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a15 15 0 0 1-2.25 2.9M6.2 7.2C3.8 9.05 2.5 12 2.5 12s3.5 6 9.5 6c1.15 0 2.2-.22 3.15-.58" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M10.25 10.25a2.6 2.6 0 0 0 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-footer">
            <button class="submit-button" type="submit">ВОЙТИ</button>
            <p class="success-message" id="successMessage">УСПЕШНО</p>
            <p class="password-help" id="passwordHelp">
              Забыли пароль?<br>
              Напишите в Telegram — <a href="https://t.me/Vlad_2hard" target="_blank" rel="noreferrer">@Vlad_2hard</a>
            </p>
          </div>
        </form>
      </section>
    </div>
    <p class="menu-preview" id="menuPreview">МЕНЮ</p>
  </main>

  <script>
    const form = document.querySelector('#authForm');
    const card = document.querySelector('#authCard');
    const loginInput = document.querySelector('#login');
    const passwordInput = document.querySelector('#password');
    const passwordDisplay = document.querySelector('#passwordDisplay');
    const eyeButton = document.querySelector('#eyeButton');
    const passwordHelp = document.querySelector('#passwordHelp');
    const successMessage = document.querySelector('#successMessage');
    const menuPreview = document.querySelector('#menuPreview');
    const authLabel = document.querySelector('#authLabel');

    let revealPassword = false;
    let maskTimer;
    let helpTimer;

    function updateReadyState() {
      const ready = loginInput.value.length > 0 && passwordInput.value.length > 0;
      form.classList.toggle('is-ready', ready);
      eyeButton.classList.toggle('is-visible', passwordInput.value.length > 0);
    }

    function renderPassword(revealLastCharacter = false) {
      const value = passwordInput.value;
      if (revealPassword) {
        passwordDisplay.textContent = value;
        return;
      }
      if (revealLastCharacter && value.length > 0) {
        passwordDisplay.textContent = '•'.repeat(value.length - 1) + value.at(-1);
        return;
      }
      passwordDisplay.textContent = '•'.repeat(value.length);
    }

    function scheduleMask(revealLastCharacter) {
      clearTimeout(maskTimer);
      renderPassword(revealLastCharacter);
      if (revealPassword || passwordInput.value.length === 0 || !revealLastCharacter) return;
      maskTimer = setTimeout(() => {
        if (!revealPassword) renderPassword(false);
      }, 500);
    }

    loginInput.addEventListener('input', updateReadyState);

    passwordInput.addEventListener('input', (event) => {
      updateReadyState();
      scheduleMask((event.inputType || '').startsWith('insert'));
    });

    eyeButton.addEventListener('click', () => {
      revealPassword = !revealPassword;
      clearTimeout(maskTimer);
      renderPassword(false);
      eyeButton.classList.toggle('is-revealed', revealPassword);
      eyeButton.setAttribute('aria-pressed', String(revealPassword));
      eyeButton.setAttribute('aria-label', revealPassword ? 'Скрыть пароль' : 'Показать пароль');
      passwordInput.focus({ preventScroll: true });
      passwordInput.setSelectionRange(passwordInput.value.length, passwordInput.value.length);
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!loginInput.value || !passwordInput.value) return;

      const isValid = loginInput.value === 'demo' && passwordInput.value === 'demo';

      if (!isValid) {
        clearTimeout(helpTimer);
        passwordHelp.classList.remove('is-visible');
        document.body.classList.remove('error-flash');
        void document.body.offsetWidth;
        document.body.classList.add('error-flash');
        window.setTimeout(() => document.body.classList.remove('error-flash'), 2250);
        helpTimer = window.setTimeout(() => passwordHelp.classList.add('is-visible'), 1200);
        return;
      }

      clearTimeout(helpTimer);
      passwordHelp.classList.remove('is-visible');
      form.classList.add('is-authenticated');
      successMessage.classList.remove('is-visible');
      window.setTimeout(() => successMessage.classList.add('is-visible'), 300);
      window.setTimeout(() => card.classList.add('is-success'), 1000);
      window.setTimeout(() => authLabel.classList.add('is-hidden'), 1000);
      window.setTimeout(() => menuPreview.classList.add('is-visible'), 1700);
    });

    updateReadyState();
    renderPassword(false);
  </script>
</body>
</html>
