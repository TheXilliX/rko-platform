services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rko_platform
      POSTGRES_USER: rko_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rko_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rko_user -d rko_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://rko_user:${POSTGRES_PASSWORD}@db:5432/rko_platform
      SESSION_SECRET: ${SESSION_SECRET}
      OWNER_LOGIN: ${OWNER_LOGIN}
      OWNER_FIRST_NAME: ${OWNER_FIRST_NAME}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  rko_pg_data:
  caddy_data:
  caddy_config:
